<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f2937">
<title>태태 매장관리</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f5f4;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--pri:#b91c1c;--ok:#15803d;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
header .who{font-size:13px;opacity:.85}
header button{background:transparent;color:#fff;border:1px solid #fff6;border-radius:8px;padding:4px 8px;font-size:12px}
nav{position:sticky;top:48px;z-index:4;display:flex;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:12px 4px;font-size:15px;color:var(--sub);border-bottom:3px solid transparent}
nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--pri)}
main{padding:14px;max-width:720px;margin:0 auto 80px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 6px;color:var(--sub)}
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer}
.btn.pri{background:var(--pri)}.btn.ok{background:var(--ok)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.big{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
.muted{color:var(--sub);font-size:13px}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.item .nm{flex:1}
.item .nm small{display:block;color:var(--sub);font-size:12px}
.item input{width:84px;flex:none;text-align:right;padding:8px}
.item .u{width:34px;flex:none;font-size:13px;color:var(--sub)}
.low{color:var(--pri);font-weight:700}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eee}
.tag.요청{background:#fef3c7;color:var(--warn)}.tag.주문완료{background:#dbeafe;color:#1d4ed8}.tag.입고완료{background:#dcfce7;color:var(--ok)}.tag.취소{background:#f3f4f6;color:#9ca3af}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90%}
.center{text-align:center}
.hide{display:none}
</style>
</head>
<body>
<header><h1>태태 매장관리</h1><div class="row" style="flex:none;gap:8px"><span class="who" id="who"></span><button id="logout" class="hide">로그아웃</button></div></header>
<nav id="nav" class="hide">
  <button data-tab="att">출퇴근</button>
  <button data-tab="inv">재고조사</button>
  <button data-tab="ord">발주요청</button>
  <button data-tab="adm" class="hide" id="admTab">관리</button>
</nav>
<main id="view"><div class="card center muted">불러오는 중...</div></main>
<div id="toast"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
